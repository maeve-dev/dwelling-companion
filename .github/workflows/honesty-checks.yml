name: honesty checks

# The three site-honesty checkers (claim phrasing, dead links, citation
# consistency) existed at the repo root with no trigger at all: there was no
# .github directory, so nothing ever ran them. This workflow is that trigger.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  honesty-checks:
    name: site honesty checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # One step per checker so a failure is attributable in the UI.
      # Each checker uses only the standard library, so there is no install
      # step. A non-zero exit fails the job (no `|| true`).
      - name: check_claims.py (overclaim phrasing)
        run: python3 check_claims.py

      - name: check_links.py (dead links)
        run: python3 check_links.py

      - name: check_citations.py (citation consistency)
        run: python3 check_citations.py
