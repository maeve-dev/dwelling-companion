name: honesty checks

# The three site-honesty checkers (claim phrasing, dead links, citation
# consistency) existed at the repo root with no trigger at all: there was no
# .github directory, so nothing ever ran them. This workflow is that trigger.
#
# Two additions, same theme -- a check that nothing invokes is not a check:
#   * check_breathing_antiphase.py covers the property the breathing-circle
#     design rests on (the two circles are locked anti-phase). That had been
#     re-verified by hand, with line numbers re-derived each pass, because no
#     checker read CSS keyframes. Its selftest proves it is known to go red.
#   * check_citations_selftest.py already existed and passed, but no workflow
#     referenced it, so it had never run in CI.
#
# A third addition, same theme -- a page can also overclaim by WHEN it is:
#   * check_freshness.py covers the freshness/liveness class ("live state",
#     "updated when the ...", "always current"). dashboard.html shipped that
#     claim while nothing regenerated it: `git log -- dashboard.html` returns
#     two commits, both dated 2026-06-24, and the "pages build and deployment"
#     run at 2026-09-23T18:18Z rebuilt the site without changing the snapshot.
#     Its selftest proves it is known to go red AND that it keeps the honest
#     "live calibration" / "live circle" feature wording out of the pattern
#     list.
#
# A fourth addition, same theme -- a page can also overclaim by WHAT it cites:
#   * check_dois.py resolves the DOI printed on each page against a checked-in
#     Crossref snapshot (dois_registry.json) and checks the page's stated title,
#     year and volume/issue/pages against it. The other citation checkers are
#     closed-world -- they compare the pages to each other -- so a citation
#     wrong in exactly the same way everywhere passes all four of them, and
#     nothing in the repo had ever resolved a DOI. It reads the cache only, so
#     CI stays hermetic and needs no network; a DOI missing from the cache is
#     reported as a coverage gap. It cannot see a retracted/replaced record, a
#     field the page omits, or a cache that has gone stale -- nothing yet
#     schedules a refresh, so a stale snapshot is a fresh risk. Its selftest
#     proves it is known to go red, hermetically (no network at all).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  honesty-checks:
    name: site honesty checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # One step per checker so a failure is attributable in the UI.
      # Each checker uses only the standard library, so there is no install
      # step. A non-zero exit fails the job (no `|| true`).
      - name: check_claims.py (overclaim phrasing)
        run: python3 check_claims.py

      - name: check_links.py (dead links)
        run: python3 check_links.py

      - name: check_citations.py (citation consistency)
        run: python3 check_citations.py

      - name: check_breathing_antiphase.py (anti-phase invariant)
        run: python3 check_breathing_antiphase.py

      - name: check_freshness.py (freshness/liveness overclaim phrasing)
        run: python3 check_freshness.py

      - name: check_dois.py (DOI resolves to the cited work)
        run: python3 check_dois.py

      # The selftests run after the checkers: a green checker whose own
      # coverage is broken is the more dangerous of the two.
      - name: check_citations_selftest.py (citation checker coverage)
        run: python3 check_citations_selftest.py

      - name: check_breathing_antiphase_selftest.py (anti-phase coverage)
        run: python3 check_breathing_antiphase_selftest.py

      - name: check_freshness_selftest.py (freshness checker coverage)
        run: python3 check_freshness_selftest.py

      - name: check_dois_selftest.py (DOI checker coverage, hermetic)
        run: python3 check_dois_selftest.py
